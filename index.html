<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Iram ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 2.6rem;
      color: #fff;
      margin-bottom: 30px;
    }

    .buttons {
      display: inline-flex;
      gap: 12px;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #yesBtn {
      background-color: #ff2e63;
      color: white;
    }

    #noBtn {
      background-color: white;
      color: #ff2e63;
      position: relative;
      transition: left 0.4s ease, top 0.4s ease;
    }

    .message {
      font-size: 2.2rem;
      color: white;
      margin-top: 20px;
      display: none;
      animation: fadeIn 1s ease forwards;
    }

    .gif {
      margin-top: 20px;
      width: 220px;
      display: none;
      border-radius: 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: fixed;
      font-size: 24px;
      animation: float 2s linear forwards;
      pointer-events: none;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.8); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Will you be my Valentine,<br>Iram Khalfe? ❤️</h1>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div class="message" id="loveMsg">
      Yaaay Iram! You just made me the happiest person alive ❤️
    </div>

    <!-- GIF appears after YES -->
    <img
      id="loveGif"
      class="gif"
      src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
      alt="Love GIF"
    />
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const msg = document.getElementById("loveMsg");
    const gif = document.getElementById("loveGif");

    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();

      const distance = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
      );

      if (distance < 120) {
        const x = Math.random() * (window.innerWidth - rect.width);
        const y = Math.random() * (window.innerHeight - rect.height);

        noBtn.style.position = "fixed";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";

      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.top = Math.random() * window.innerHeight + "px";

      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2000);
    }

    yesBtn.addEventListener("click", () => {
      msg.style.display = "block";
      gif.style.display = "block";
      yesBtn.style.display = "none";
      noBtn.style.display = "none";

      for (let i = 0; i < 40; i++) {
        setTimeout(createHeart, i * 60);
      }
    });
  </script>

</body>
</html>
