<!DOCTYPE html>
<html>
<head>
<title>Event Ticket</title>
</head>

<body>

<button id="ticketBtn">Coming Soon</button>

<script>
document.getElementById("ticketBtn").addEventListener("click", function() {

    // simulate tickets releasing
    setTimeout(function() {
        document.getElementById("ticketBtn").innerText = "Book Now";
    }, 2000);

});
</script>

</body>
</html>
