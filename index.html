<!DOCTYPE html>
<html>
<head>
<title>Ticket Release Simulation</title>
</head>

<body>

<button id="ticketBtn">Coming Soon</button>

<script>

let btn = document.getElementById("ticketBtn");

function toggleButton() {

    if (btn.innerText === "Coming Soon") {
        btn.innerText = "Book Now";
    } 
    else {
        btn.innerText = "Coming Soon";
    }

}

// change every 30 seconds
setInterval(toggleButton, 30000);

</script>

</body>
</html>
